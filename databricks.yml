bundle:
  name: abac-system-tables-accelerator

variables:
  governance_catalog:
    description: Tenant-owned catalog for UDF and deployment state only
    default: system_tables_governance
  governance_schema:
    description: Governance control-plane schema
    default: abac
  warehouse_id:
    description: SQL warehouse used by Statement Execution; override outside Git
    default: replace-at-deploy-time

artifacts:
  default:
    type: whl
    build: python3 -m build --wheel
    path: .

sync:
  include:
    - examples/*.json

targets:
  validation:
    default: true
    mode: development
    variables:
      governance_catalog: system_tables_governance
      governance_schema: abac
      warehouse_id: replace-at-deploy-time
